<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script>
/* Sets the light/dark theme before the first paint, so there is no flash. Same rule as applyTheme() in app.js. */
(function () {
  var p = 'auto';
  try { p = localStorage.getItem('nutrilog.theme') || 'auto'; } catch (e) { /* private mode */ }
  var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#000000' : '#ffffff');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutrilog">
<meta name="description" content="Calorie, macro and micronutrient diary using CIQUAL and Open Food Facts.">
<title>Nutrilog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"><p class="muted pad">Loading food database…</p></main>
  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Nutrilog needs JavaScript.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
